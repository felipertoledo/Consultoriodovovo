<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consultório do Vovô — Prontuário eletrônico do Dr. Felipe Ribeiro Toledo (CRM-SP 216.986). Dados criptografados localmente.">
  <meta name="theme-color" content="#166534">
  <meta name="robots" content="noindex, nofollow">

  <!-- PWA / iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Consultório">
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">

  <title>Consultório do Vovô</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/img/icon-512.png">

  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/app.css">

  <!-- Bibliotecas vendored localmente (funcionam offline) -->
  <script src="./assets/lib/dexie.min.js"></script>
  <script defer src="./assets/lib/alpine.min.js"></script>

  <!-- jsPDF (geração de PDFs client-side) — vendored local para funcionar offline -->
  <script src="./assets/lib/jspdf.umd.min.js"></script>
  <script>
    // Log de diagnóstico do carregamento do jsPDF
    (function() {
      const ready = !!(window.jspdf && window.jspdf.jsPDF) || !!window.jsPDF;
      if (ready) {
        console.log('[CV] jsPDF carregado:',
          window.jspdf ? 'window.jspdf.jsPDF' : 'window.jsPDF');
      } else {
        console.error('[CV] jsPDF NÃO carregou! Verifique assets/lib/jspdf.umd.min.js');
      }
    })();
  </script>
</head>
<body>
  <!-- Loader inicial -->
  <div id="boot-loader" class="full-page-loader">
    <div style="text-align: center;">
      <div class="spinner" style="margin: 0 auto"></div>
      <p class="mt-4 muted">Carregando Consultório do Vovô…</p>
    </div>
  </div>

  <!-- App root (preenchido pelo router) -->
  <div id="app" x-cloak></div>

  <!-- Módulos core (ordem importa) -->
  <script src="./modules/crypto.js"></script>
  <script src="./modules/ui.js"></script>
  <script src="./modules/db.js"></script>
  <script src="./modules/auth.js"></script>
  <script src="./modules/router.js"></script>
  <script src="./modules/clinical-data.js"></script>
  <script src="./modules/prosa-generator.js"></script>
  <script src="./modules/pdf-builder.js"></script>
  <script src="./modules/pdf-documents.js"></script>
  <script src="./modules/pdf-documents-extra.js"></script>
  <script src="./modules/backup.js"></script>

  <!-- Componentes de tela -->
  <script src="./components/setup-wizard.js"></script>
  <script src="./components/login.js"></script>
  <script src="./components/dashboard.js"></script>
  <script src="./components/pacientes-lista.js"></script>
  <script src="./components/paciente-form.js"></script>
  <script src="./components/exame-psiquico.js"></script>
  <script src="./components/consulta-form.js"></script>
  <script src="./components/documentos.js"></script>
  <script src="./components/config.js"></script>

  <!-- Captura do prompt de instalação do PWA -->
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Impede o prompt automático do navegador
      e.preventDefault();
      window.deferredInstallPrompt = e;
      console.log('[CV] PWA disponível para instalação');
    });
    window.addEventListener('appinstalled', () => {
      console.log('[CV] PWA instalado');
      window.deferredInstallPrompt = null;
    });
  </script>

  <!-- Banner de atualização do Service Worker (oculto por padrão) -->
  <div id="sw-update-banner" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #166534; color: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: none; gap: 16px; align-items: center; max-width: 90vw;">
    <div>
      <strong>🌱 Nova versão disponível</strong>
      <div style="font-size: 13px; opacity: 0.9; margin-top: 4px">Recarregue para atualizar</div>
    </div>
    <button id="sw-update-btn" style="background: white; color: #166534; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">
      Atualizar
    </button>
    <button id="sw-dismiss-btn" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); padding: 8px 12px; border-radius: 8px; cursor: pointer;" title="Adiar até a próxima vez que abrir o app">
      Depois
    </button>
  </div>

  <!-- Service Worker registration + atualização -->
  <script>
    (function registerSW() {
      if (!('serviceWorker' in navigator)) {
        console.log('[CV] Service Worker não suportado');
        return;
      }

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          console.log('[CV] Service Worker registrado, escopo:', reg.scope);

          // Detecta nova versão pronta para ativar
          function showUpdateBanner(newWorker) {
            const banner = document.getElementById('sw-update-banner');
            banner.style.display = 'flex';

            document.getElementById('sw-update-btn').onclick = () => {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            };
            document.getElementById('sw-dismiss-btn').onclick = () => {
              banner.style.display = 'none';
            };
          }

          // Se já tem um SW em waiting (página recarregada com update pendente)
          if (reg.waiting) {
            showUpdateBanner(reg.waiting);
          }

          // Se chegar update enquanto a página está aberta
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(newWorker);
              }
            });
          });

          // Quando o controller muda (skipWaiting foi chamado), recarrega
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });

          // Verifica updates a cada 30 minutos enquanto a aba está aberta
          setInterval(() => {
            reg.update().catch(() => {});
          }, 30 * 60 * 1000);

        } catch (e) {
          console.error('[CV] Falha ao registrar Service Worker:', e);
        }
      });
    })();
  </script>

  <!-- Bootstrap da aplicação -->
  <script>
    (async function bootstrap() {
      // Wait for Alpine to be ready
      await new Promise(resolve => {
        if (window.Alpine) resolve();
        else document.addEventListener('alpine:init', resolve);
      });

      // Verifica se já existe vault
      const hasVault = await DB.hasVault();

      const app = document.getElementById('app');

      // Helpers de layout
      function renderAppShell(activeRoute) {
        app.innerHTML = `
          <div class="app-shell">
            <aside class="app-sidebar">
              <div class="nav-section">
                <div class="nav-section-title">Consultório</div>
                <button class="nav-item ${activeRoute === '/' ? 'active' : ''}"
                        onclick="Router.navigate('/')">
                  🏠 Início
                </button>
                <button class="nav-item ${activeRoute.startsWith('/paciente') ? 'active' : ''}"
                        onclick="Router.navigate('/pacientes')">
                  👥 Pacientes
                </button>
                <button class="nav-item" disabled style="opacity: 0.4; cursor: not-allowed"
                        title="Em construção (Sprint 2)">
                  📋 Histórico do dia
                </button>
                <button class="nav-item" disabled style="opacity: 0.4; cursor: not-allowed"
                        title="Em construção (Sprint 2)">
                  📝 Prontuário digital
                </button>
              </div>
              <div class="nav-section">
                <div class="nav-section-title">Sistema</div>
                <button class="nav-item ${activeRoute === '/config' ? 'active' : ''}"
                        onclick="Router.navigate('/config')">
                  ⚙️ Configurações
                </button>
                <button class="nav-item" onclick="Auth.lock().then(() => Router.navigate('/'))">
                  🔒 Bloquear
                </button>
              </div>
              <div style="margin-top: auto; padding: var(--space-3); font-size: var(--text-xs); color: var(--text-muted);">
                <div>🔐 Cofre destrancado</div>
                <div class="mt-2">Trava em 15 min sem uso</div>
              </div>
            </aside>

            <header class="app-header">
              <div class="brand">
                <div class="brand-logo">CV</div>
                <div>
                  <div class="brand-name">Consultório do Vovô</div>
                  <div class="brand-tagline">Felipe Ribeiro Toledo · CRM-SP 216.986</div>
                </div>
              </div>
              <div class="header-spacer"></div>
              <div class="header-actions">
                <button class="btn btn-ghost btn-icon" onclick="Auth.lock().then(() => Router.navigate('/'))"
                        title="Bloquear cofre">
                  🔒
                </button>
              </div>
            </header>

            <main class="app-main">
              <div id="route-content"></div>
            </main>
          </div>
        `;
        return document.getElementById('route-content');
      }

      // Define rotas
      Router.register('/', () => {
        if (!Auth.isUnlocked()) {
          if (!hasVault) renderSetupWizard(app);
          else renderLogin(app);
          return;
        }
        const target = renderAppShell('/');
        renderDashboard(target);
      });

      Router.register('/pacientes', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/pacientes');
        renderPacientesLista(target);
      });

      Router.register('/paciente/:id', ({ id }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderPacienteForm(target, id);
      });

      Router.register('/paciente/:id/consulta/:consultaId', ({ id, consultaId }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderConsultaForm(target, id, consultaId);
      });

      Router.register('/paciente/:id/documentos', ({ id }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderDocumentos(target, id, 'menu');
      });

      Router.register('/paciente/:id/documentos/:tipo', ({ id, tipo }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderDocumentos(target, id, tipo);
      });

      Router.register('/config', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/config');
        renderConfig(target);
      });

      // Listener para navegação programática a partir dos componentes
      document.addEventListener('navigate', (e) => {
        Router.navigate(e.detail);
      });

      // Listener para mudanças de estado de auth: força re-render
      Auth.on((event) => {
        if (event === 'locked') {
          Router.navigate('/');
        }
      });

      // Esconde o loader e inicia
      document.getElementById('boot-loader').style.display = 'none';
      document.getElementById('app').removeAttribute('x-cloak');

      Router.start();
    })();
  </script>
</body>
</html>
