  <script>
    // Log de diagnóstico do carregamento do jsPDF
    (function() {
      const ready = !!(window.jspdf && window.jspdf.jsPDF) || !!window.jsPDF;
      if (ready) {
        console.log('[CV] jsPDF carregado:',
          window.jspdf ? 'window.jspdf.jsPDF' : 'window.jsPDF');
      } else {
        console.error('[CV] jsPDF NÃO carregou! Verifique assets/lib/jspdf.umd.min.js');
      }
    })();

    /* ---- ScrollSpy: ativa itens do minimapa conforme a rolagem ---- */
    window.ScrollSpy = (() => {
      let obs = null;
      function ligar(rootEl) {
        try {
          desligar();
          if (typeof IntersectionObserver === 'undefined') return;
          const secs = rootEl.querySelectorAll('[data-spy]');
          if (!secs.length) return;
          const mapa = rootEl.closest ? document : document;
          obs = new IntersectionObserver((entries) => {
            entries.forEach(en => {
              if (!en.isIntersecting) return;
              const id = en.target.getAttribute('data-spy');
              document.querySelectorAll('.minimap-item').forEach(mi => {
                mi.classList.toggle('active', mi.getAttribute('data-spy-for') === id);
              });
            });
          }, { rootMargin: '-25% 0px -65% 0px', threshold: 0 });
          secs.forEach(s => obs.observe(s));
        } catch (_) {}
      }
      function irPara(id) {
        const el = document.querySelector('[data-spy="' + id + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      function desligar() { if (obs) { obs.disconnect(); obs = null; } }
      return { ligar, irPara, desligar };
    })();

    /* ---- Rail: estado colapsado persistido ---- */
    window.Rail = (() => {
      const KEY = 'cdv_rail';
      function get() {
        try { return localStorage.getItem(KEY) === 'min' ? 'min' : 'full'; } catch (_) { return 'full'; }
      }
      function toggle() {
        const novo = get() === 'min' ? 'full' : 'min';
        try { localStorage.setItem(KEY, novo); } catch (_) {}
        const shell = document.querySelector('.app-shell');
        if (shell) shell.setAttribute('data-rail', novo);
      }
      return { get, toggle };
    })();
  </script>

  <div id="cmdk-root" style="display: none"></div>
  <div id="kbdhelp-root" style="display: none"></div>
  <script>
    window.CmdK = (() => {
      const ACTIONS = [
        { tipo: 'acao', icone: 'i-plus',        rotulo: 'Novo paciente',           rota: '/paciente/novo', kbd: 'N P' },
        { tipo: 'acao', icone: 'i-rx',          rotulo: 'Nova prescrição',         rota: '/prescricao',    kbd: 'N R' },
        { tipo: 'acao', icone: 'i-keyboard',    rotulo: 'Atalhos do teclado',      fn: () => window.KbdHelp && KbdHelp.abrir(), kbd: '?' },
        { tipo: 'nav',  icone: 'i-home',        rotulo: 'Início',                  rota: '/',          kbd: 'G D' },
        { tipo: 'nav',  icone: 'i-users',       rotulo: 'Pacientes',               rota: '/pacientes', kbd: 'G P' },
        { tipo: 'nav',  icone: 'i-calendar',    rotulo: 'Agenda',                  rota: '/agenda',    kbd: 'G A' },
        { tipo: 'nav',  icone: 'i-heart-pulse', rotulo: 'Painel Hiperdia',         rota: '/hiperdia',  kbd: 'G H' },
        { tipo: 'nav',  icone: 'i-clock',       rotulo: 'Últimas consultas',       rota: '/consultas', kbd: 'G U' },
        { tipo: 'nav',  icone: 'i-cash',        rotulo: 'Financeiro',              rota: '/financeiro', kbd: 'G F' },
        { tipo: 'nav',  icone: 'i-clipboard',   rotulo: 'Templates de prescrição', rota: '/templates', kbd: 'G T' },
        { tipo: 'nav',  icone: 'i-sync',        rotulo: 'Sincronização',           rota: '/sync',      kbd: 'G S' },
        { tipo: 'nav',  icone: 'i-settings',    rotulo: 'Configurações',           rota: '/config',    kbd: 'G X' }
      ];

      let aberto = false;
      let pacientes = [];
      let recentes = [];     // pacientes das últimas consultas
      let resultados = [];
      let ativo = 0;
      let root, inputEl;

      const norm = (s) => (s || '').toString()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

      function montar() {
        root = document.getElementById('cmdk-root');
        root.innerHTML = `
          <div class="cmdk-overlay" id="cmdk-overlay">
            <div class="cmdk" role="dialog" aria-modal="true" aria-label="Busca rápida">
              <div class="cmdk-input-row">
                <svg class="icon"><use href="#i-search"/></svg>
                <input class="cmdk-input" id="cmdk-input" type="text"
                       placeholder="Buscar paciente ou ir para…"
                       autocomplete="off" spellcheck="false">
                <kbd>esc</kbd>
              </div>
              <div class="cmdk-results" id="cmdk-results"></div>
              <div class="cmdk-foot">
                <span><kbd>↑↓</kbd> navegar</span>
                <span><kbd>↵</kbd> abrir</span>
                <span><kbd>?</kbd> atalhos</span>
              </div>
            </div>
          </div>
        `;
        root.querySelector('#cmdk-overlay').addEventListener('mousedown', (e) => {
          if (e.target.id === 'cmdk-overlay') fechar();
        });
        inputEl = root.querySelector('#cmdk-input');
        inputEl.addEventListener('input', () => { ativo = 0; filtrar(); });
        inputEl.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); ativo = Math.min(ativo + 1, resultados.length - 1); pintar(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); ativo = Math.max(ativo - 1, 0); pintar(); }
          else if (e.key === 'Enter') { e.preventDefault(); escolher(ativo); }
          else if (e.key === 'Escape') { e.preventDefault(); fechar(); }
        });
      }

      function itemPaciente(p, grupo) {
        return {
          tipo: grupo, paciente: true, rotulo: p.nome,
          ini: (window.UI && UI.getInitials) ? UI.getInitials(p.nome) : '?',
          cor: (window.UI && UI.avatarColorFromName) ? UI.avatarColorFromName(p.nome) : 'var(--color-primary-500)',
          meta: p.dataNascimento && window.UI ? (UI.calculateAge(p.dataNascimento) + ' anos') : '',
          rota: '/paciente/' + p.id
        };
      }

      function filtrar() {
        const q = norm(inputEl.value.trim());
        if (!q) {
          // Sem busca: recentes em cima, ações e navegação embaixo
          resultados = [...recentes.map(p => itemPaciente(p, 'recente')), ...ACTIONS];
          pintar();
          return;
        }
        const acoes = ACTIONS.filter(a => norm(a.rotulo).includes(q));
        const pacs = pacientes
          .filter(p => norm(p.nome).includes(q))
          .slice(0, 8)
          .map(p => itemPaciente(p, 'paciente'));
        resultados = [...pacs, ...acoes];
        pintar();
      }

      const ROTULO_GRUPO = { recente: 'Recentes', paciente: 'Pacientes', acao: 'Ações', nav: 'Ir para' };

      function pintar() {
        const box = root.querySelector('#cmdk-results');
        if (resultados.length === 0) {
          box.innerHTML = `<div class="cmdk-empty">Nada encontrado. Tente outro nome.</div>`;
          return;
        }
        let html = '';
        let grupoAtual = '';
        resultados.forEach((r, i) => {
          const grupo = ROTULO_GRUPO[r.tipo] || '';
          if (grupo !== grupoAtual) {
            grupoAtual = grupo;
            html += `<div class="cmdk-group-label">${grupo}</div>`;
          }
          const visual = r.paciente
            ? `<span class="cmdk-ava" style="background:${r.cor}">${r.ini}</span>`
            : `<svg class="icon"><use href="#${r.icone}"/></svg>`;
          html += `
            <button class="cmdk-item ${i === ativo ? 'active' : ''}" data-i="${i}">
              ${visual}
              <span>${r.rotulo}</span>
              ${r.meta ? `<span class="cmdk-item-meta">${r.meta}</span>` : ''}
              ${r.kbd ? `<span class="cmdk-item-meta"><kbd>${r.kbd}</kbd></span>` : ''}
            </button>`;
        });
        box.innerHTML = html;
        box.querySelectorAll('.cmdk-item').forEach(el => {
          el.addEventListener('click', () => escolher(parseInt(el.dataset.i, 10)));
          el.addEventListener('mousemove', () => {
            const i = parseInt(el.dataset.i, 10);
            if (i !== ativo) { ativo = i; pintar(); }
          });
        });
        const ativoEl = box.querySelector('.cmdk-item.active');
        if (ativoEl) ativoEl.scrollIntoView({ block: 'nearest' });
      }

      function escolher(i) {
        const r = resultados[i];
        if (!r) return;
        fechar();
        if (typeof r.fn === 'function') { r.fn(); return; }
        Router.navigate(r.rota);
      }

      async function carregarRecentes() {
        recentes = [];
        try {
          if (window.DB && DB.listConsultasRecentes) {
            const feed = await DB.listConsultasRecentes(40);
            const vistos = new Set();
            for (const c of feed) {
              const id = c.pacienteId;
              const nome = c.pacienteNome || (c.paciente && c.paciente.nome);
              if (!id || vistos.has(id)) continue;
              vistos.add(id);
              recentes.push({ id, nome: nome || '(sem nome)', dataNascimento: c.pacienteDataNascimento || null });
              if (recentes.length >= 5) break;
            }
          }
        } catch (_) { recentes = []; }
      }

      async function abrir() {
        if (aberto) return;
        if (!window.Auth || !Auth.isUnlocked()) return;
        aberto = true;
        if (!root || !root.innerHTML) montar();
        document.getElementById('cmdk-root').style.display = '';
        try { pacientes = await DB.listPacientes(); } catch (_) { pacientes = []; }
        await carregarRecentes();
        inputEl.value = '';
        ativo = 0;
        filtrar();
        requestAnimationFrame(() => inputEl.focus());
      }

      function fechar() {
        if (!aberto) return;
        aberto = false;
        document.getElementById('cmdk-root').style.display = 'none';
      }

      function estaAberto() { return aberto; }

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          aberto ? fechar() : abrir();
        }
      });

      return { abrir, fechar, estaAberto };
    })();

    /* ---- Atalhos de teclado globais + folha de ajuda (?) ---- */
    window.KbdHelp = (() => {
      let aberto = false;
      const LINHAS = [
        ['Busca rápida', ['Ctrl', 'K']],
        ['Busca rápida (alternativa)', ['/']],
        ['Esta ajuda', ['?']],
        ['Início', ['G', 'D']],
        ['Pacientes', ['G', 'P']],
        ['Agenda', ['G', 'A']],
        ['Hiperdia', ['G', 'H']],
        ['Últimas consultas', ['G', 'U']],
        ['Templates', ['G', 'T']],
        ['Sincronização', ['G', 'S']],
        ['Configurações', ['G', 'X']],
        ['Novo paciente', ['N', 'P']],
        ['Nova prescrição', ['N', 'R']],
        ['Bloquear cofre', ['Shift', 'L']]
      ];

      function montar() {
        const root = document.getElementById('kbdhelp-root');
        root.innerHTML = `
          <div class="kbdhelp-overlay" id="kbdhelp-overlay">
            <div class="kbdhelp" role="dialog" aria-modal="true" aria-label="Atalhos do teclado">
              <h2>Atalhos do teclado</h2>
              <div class="sub">Sequências: pressione a primeira tecla, depois a segunda (fora de campos de texto).</div>
              <div class="kbdhelp-grid">
                ${LINHAS.map(([rotulo, teclas]) => `
                  <div class="kbdhelp-row">
                    <span>${rotulo}</span>
                    <span class="keys">${teclas.map(t => `<kbd>${t}</kbd>`).join('')}</span>
                  </div>`).join('')}
              </div>
              <div class="kbdhelp-foot">Pressione <kbd>esc</kbd> para fechar</div>
            </div>
          </div>
        `;
        root.querySelector('#kbdhelp-overlay').addEventListener('mousedown', (e) => {
          if (e.target.id === 'kbdhelp-overlay') fechar();
        });
      }

      function abrir() {
        if (aberto) return;
        if (!window.Auth || !Auth.isUnlocked()) return;
        const root = document.getElementById('kbdhelp-root');
        if (!root.innerHTML) montar();
        root.style.display = '';
        aberto = true;
      }
      function fechar() {
        if (!aberto) return;
        document.getElementById('kbdhelp-root').style.display = 'none';
        aberto = false;
      }
      function estaAberto() { return aberto; }
      return { abrir, fechar, estaAberto };
    })();

    (() => {
      const SEQ = {
        'g d': '/',          'g p': '/pacientes', 'g a': '/agenda',
        'g h': '/hiperdia',  'g u': '/consultas', 'g t': '/templates',
        'g f': '/financeiro',
        'g s': '/sync',      'g x': '/config',
        'n p': '/paciente/novo', 'n r': '/prescricao'
      };
      let prefixo = null;
      let timer = null;

      function digitando(e) {
        const t = e.target;
        if (!t) return false;
        const tag = (t.tagName || '').toLowerCase();
        return tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;
      }

      document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        // Esc fecha a ajuda
        if (e.key === 'Escape' && window.KbdHelp && KbdHelp.estaAberto()) {
          e.preventDefault(); KbdHelp.fechar(); return;
        }
        if (digitando(e)) return;
        if (window.CmdK && CmdK.estaAberto()) return;
        if (!window.Auth || !Auth.isUnlocked()) return;

        const k = e.key.toLowerCase();

        if (e.key === '?') {
          e.preventDefault();
          KbdHelp.estaAberto() ? KbdHelp.fechar() : KbdHelp.abrir();
          prefixo = null;
          return;
        }
        if (e.key === '/') { e.preventDefault(); CmdK.abrir(); prefixo = null; return; }
        if (e.shiftKey && k === 'l') {
          e.preventDefault();
          Auth.lock().then(() => Router.navigate('/'));
          prefixo = null;
          return;
        }
        if (window.KbdHelp && KbdHelp.estaAberto()) return;

        if (prefixo) {
          const combo = prefixo + ' ' + k;
          prefixo = null;
          clearTimeout(timer);
          if (SEQ[combo]) { e.preventDefault(); Router.navigate(SEQ[combo]); }
          return;
        }
        if (k === 'g' || k === 'n') {
          prefixo = k;
          clearTimeout(timer);
          timer = setTimeout(() => { prefixo = null; }, 900);
        }
      });
    })();
  </script>

  <!-- Service Worker registration + atualização -->
  <script>
    (function registerSW() {
      if (!('serviceWorker' in navigator)) {
        console.log('[CV] Service Worker não suportado');
        return;
      }

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          console.log('[CV] Service Worker registrado, escopo:', reg.scope);

          // Detecta nova versão pronta para ativar
          function showUpdateBanner(newWorker) {
            const banner = document.getElementById('sw-update-banner');
            banner.style.display = 'flex';

            document.getElementById('sw-update-btn').onclick = () => {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            };
            document.getElementById('sw-dismiss-btn').onclick = () => {
              banner.style.display = 'none';
            };
          }

          // Se já tem um SW em waiting (página recarregada com update pendente)
          if (reg.waiting) {
            showUpdateBanner(reg.waiting);
          }

          // Se chegar update enquanto a página está aberta
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(newWorker);
              }
            });
          });

          // Quando o controller muda (skipWaiting foi chamado), recarrega
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });

          // Verifica updates a cada 30 minutos enquanto a aba está aberta
          setInterval(() => {
            reg.update().catch(() => {});
          }, 30 * 60 * 1000);

        } catch (e) {
          console.error('[CV] Falha ao registrar Service Worker:', e);
        }
      });
    })();
  </script>

          const ic = document.getElementById('temaIcone');

      // Relógio do cabeçalho (atualiza a cada 30s)
      function ligarRelogio() {

        if (!el) return;
        const tick = () => {
          const agora = new Date();
          const data = agora.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
          const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          el.textContent = `${data} · ${hora}`;

        tick();
        if (window.__cvClock) clearInterval(window.__cvClock);

      });

      Router.register('/paciente/:id', ({ id }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderPacienteForm(target, id);
      });

      Router.register('/paciente/:id/consulta/:consultaId', ({ id, consultaId }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderConsultaForm(target, id, consultaId);
      });

      Router.register('/paciente/:id/documentos', ({ id }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderDocumentos(target, id, 'menu');
      });

      Router.register('/paciente/:id/documentos/:tipo', ({ id, tipo }) => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/paciente');
        renderDocumentos(target, id, tipo);
      });

      Router.register('/config', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/config');
        renderConfig(target);
      });

      Router.register('/prescricao', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/prescricao');
        renderPrescricaoRapida(target);
      });

      Router.register('/agenda', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/agenda');
        renderAgenda(target);
      });

      Router.register('/templates', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/templates');
        renderTemplates(target);
      });

      Router.register('/hiperdia', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/hiperdia');
        renderHiperdia(target);
      });

      Router.register('/consultas', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/consultas');
        renderConsultasRecentes(target);
      });

      Router.register('/financeiro', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/financeiro');
        renderFinanceiro(target);
      });

      Router.register('/sync', () => {
        if (!Auth.isUnlocked()) { Router.navigate('/'); return; }
        const target = renderAppShell('/sync');
        renderSync(target);
      });

      // Listener para navegação programática a partir dos componentes
      document.addEventListener('navigate', (e) => {
        Router.navigate(e.detail);
      });

      // Listener para mudanças de estado de auth: força re-render
      Auth.on((event) => {
        if (event === 'locked') {
          if (window.CmdK) CmdK.fechar();
          Router.navigate('/');
        }
      });

      // Esconde o loader e inicia
      document.getElementById('boot-loader').style.display = 'none';
      document.getElementById('app').removeAttribute('x-cloak');

      // Liga auto-sync se configurado e habilitado
      if (window.Auth && window.Auth.on && window.Sync) {
        Auth.on(async (evento) => {
          if (evento === 'unlocked') {
            try {
              const cfg = await DB.db.config.get('sync_auto');
              const auto = cfg && cfg.value === true;
              const status = await Sync.status();
              if (auto && status.configurado) {
                Sync.iniciarAutoSync((r) => {
                  if (r && r.sucesso === false) {
                    console.warn('Auto-sync falhou:', r.erro);
                  }
                });
              }
            } catch (e) {
              console.warn('Erro ao iniciar auto-sync:', e);
            }
          } else if (evento === 'locked') {
            if (window.Sync) Sync.pararAutoSync();
          }
        });
      }

      Router.start();
    })();
  </script>
</body>
</html>
